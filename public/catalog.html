<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Каталог запчастей GM Uzbekistan — Tashcom</title>
<link rel="icon" type="image/svg+xml" href="/t6.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D1526;--bg2:#111D35;--card:#172040;--card2:#1E2D52;
  --cyan:#00BFFF;--text:#EDF4FF;--muted:#7A9EC0;--light:#B8D0EA;
  --border:rgba(0,191,255,0.15);--border2:rgba(255,255,255,0.09);
  --green:#22CC66;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#00BFFF44;border-radius:2px}

/* NAV */
nav{background:rgba(13,21,38,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--border2);padding:14px 48px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:'Space Grotesk',sans-serif;font-size:1.2rem;font-weight:700;color:var(--text)}
.nav-logo span{color:var(--cyan)}
.nav-links{display:flex;gap:16px;align-items:center}
.nav-links a{color:var(--muted);text-decoration:none;font-size:.85rem;transition:color .2s}
.nav-links a:hover{color:var(--cyan)}
.nav-btn{background:var(--cyan);color:#061020;padding:8px 20px;border-radius:8px;font-weight:600;font-size:.82rem;text-decoration:none;transition:opacity .2s}
.nav-btn:hover{opacity:.85;color:#061020}

/* HERO */
.hero{padding:64px 48px 48px;max-width:1400px;margin:0 auto;text-align:center}
.hero-tag{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin-bottom:12px}
.hero h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.8rem,3.5vw,2.8rem);font-weight:700;margin-bottom:12px;letter-spacing:-.02em}
.hero p{color:var(--muted);font-size:1rem;max-width:560px;margin:0 auto 32px}

/* SEARCH */
.search-bar{max-width:560px;margin:0 auto 48px;position:relative}
.search-bar input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 20px 14px 48px;color:var(--text);font-family:'Inter',sans-serif;font-size:.95rem;outline:none;transition:border-color .2s}
.search-bar input:focus{border-color:var(--cyan)}
.search-bar input::placeholder{color:var(--muted)}
.search-bar .s-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-count{text-align:center;font-size:.8rem;color:var(--muted);margin-top:-36px;margin-bottom:36px}

/* CATEGORY TABS */
.cat-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:1400px;margin:0 auto 40px;padding:0 24px}
.cat-tab{background:var(--card);border:1px solid var(--border2);border-radius:100px;padding:8px 18px;font-size:.78rem;font-weight:500;color:var(--muted);cursor:pointer;transition:all .2s;white-space:nowrap}
.cat-tab:hover,.cat-tab.active{background:rgba(0,191,255,.12);border-color:var(--cyan);color:var(--cyan)}

/* GRID */
.catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;max-width:1400px;margin:0 auto;padding:0 24px 80px}

/* PART CARD */
.pcard{background:var(--card);border:1px solid var(--border2);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .25s cubic-bezier(.22,1,.36,1),border-color .25s,box-shadow .25s;position:relative}
.pcard:hover{transform:translateY(-6px);border-color:rgba(0,191,255,.4);box-shadow:0 20px 48px rgba(0,0,0,.4)}
.pcard.added{border-color:var(--green)}

/* SVG ILLUSTRATION */
.pcard-img{width:100%;height:140px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0D2040,#1A3060);position:relative;overflow:hidden}
.pcard-img svg{width:100%;height:100%}
.pcard-cat-badge{position:absolute;top:10px;left:10px;background:rgba(0,191,255,.15);border:1px solid rgba(0,191,255,.3);border-radius:6px;padding:3px 9px;font-size:.65rem;font-weight:600;color:var(--cyan);letter-spacing:.04em;text-transform:uppercase}

/* CARD BODY */
.pcard-body{padding:14px 16px}
.pcard-name{font-family:'Space Grotesk',sans-serif;font-size:.88rem;font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.3}
.pcard-meta{font-size:.73rem;color:var(--muted);margin-bottom:12px}
.pcard-add{width:100%;background:rgba(0,191,255,.1);border:1px solid var(--border);border-radius:8px;color:var(--cyan);padding:8px;font-family:'Space Grotesk',sans-serif;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.pcard-add:hover{background:rgba(0,191,255,.2)}
.pcard.added .pcard-add{background:rgba(34,204,102,.12);border-color:rgba(34,204,102,.3);color:var(--green)}

/* CART FLOAT */
#cart-float{position:fixed;bottom:28px;right:28px;z-index:500;display:none}
.cart-btn{background:linear-gradient(135deg,var(--cyan),#007BB8);color:#061020;border:none;border-radius:14px;padding:14px 24px;font-family:'Space Grotesk',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:0 8px 28px rgba(0,191,255,.35);transition:transform .2s}
.cart-btn:hover{transform:translateY(-2px)}
.cart-count{background:#061020;color:var(--cyan);border-radius:100px;padding:2px 10px;font-size:.8rem}

/* EMPTY */
.empty{text-align:center;padding:80px 24px;color:var(--muted)}
.empty-icon{font-size:3rem;margin-bottom:16px}

/* RESPONSIVE */
@media(max-width:768px){
  nav{padding:12px 20px}
  .nav-links{display:none}
  .hero{padding:40px 20px 32px}
  .catalog-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));padding:0 16px 80px;gap:12px}
  .pcard-img{height:110px}
  #cart-float{bottom:20px;right:16px}
}
</style>
</head>

  'Cobalt': {bg:'rgba(0,191,255,.15)', color:'#00BFFF', years:'2012–2024'},
  'Nexia 3': {bg:'rgba(100,180,255,.12)', color:'#64B4FF', years:'2016–2024'},

  'Labo': {bg:'rgba(255,120,80,.12)', color:'#FF7850', years:'1995–2024'},
  'Matiz': {bg:'rgba(180,100,255,.12)', color:'#B464FF', years:'2001–2015'},
};


// Render category tabs
function renderTabs() {
  const el = document.getElementById('cat-tabs');
  let html = `<div class="cat-tab ${activecat==='all'?'active':''}" onclick="setcat('all')">Все (${ALL_PARTS.length})</div>`;
  Object.entries(CAT_NAMES).forEach(([k,v]) => {
    const count = PARTS[k].length;
    html += `<div class="cat-tab ${activecat===k?'active':''}" onclick="setcat('${k}')">${CAT_ICONS[k]} ${v} (${count})</div>`;
  });
  el.innerHTML = html;
}

let activemodel = 'all';
function setcat(cat) {
  activecat = cat;
  renderTabs();
  renderGrid();
}
function setmodel(model) {
  activemodel = model;
  renderModelTabs();
  renderGrid();
}
function renderModelTabs() {
  let el = document.getElementById('model-tabs');
  if (!el) return;
  const allCount = ALL_PARTS.filter(p => activecat === 'all' || p.cat === activecat).length;
  let html = `<div class="cat-tab ${activemodel==='all'?'active':''}" onclick="setmodel('all')">Все модели</div>`;
  MODELS.forEach(m => {
    const mc = MODEL_COLORS[m];
    const count = ALL_PARTS.filter(p => p.model === m && (activecat === 'all' || p.cat === activecat)).length;
    html += `<div class="cat-tab ${activemodel===m?'active':''}" onclick="setmodel('${m}')" style="${activemodel===m?'border-color:'+mc.color+';color:'+mc.color:''}">
      <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${mc.color};margin-right:4px"></span>${m} (${count})
    </div>`;
  });
  el.innerHTML = html;
}

// Render grid
function renderGrid() {
  const q = searchQ.toLowerCase().trim();
  const filtered = ALL_PARTS.filter(p => {
    const matchCat = activecat === 'all' || p.cat === activecat;
    const matchModel = activemodel === 'all' || p.model === activemodel;
    const matchQ = !q || p.name.toLowerCase().includes(q) || p.model.toLowerCase().includes(q);
    return matchCat && matchModel && matchQ;
  });

  const countEl = document.getElementById('search-count');
  countEl.textContent = q ? `Найдено: ${filtered.length} позиций` : '';

  const grid = document.getElementById('catalog-grid');
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🔍</div><p>Ничего не найдено</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map(p => {
    const key = p.model + '::' + p.name;
    const isAdded = !!cart[key];
    const mc = MODEL_COLORS[p.model] || {bg:'rgba(0,191,255,.1)',color:'#00BFFF',years:''};
    return `<div class="pcard ${isAdded?'added':''}" id="card-${CSS.escape(key)}" style="${isAdded?'border-color:var(--green)':''}">
      <div class="pcard-img">
        ${CAT_SVG[p.cat] || ''}
        <div class="pcard-cat-badge">${CAT_ICONS[p.cat]} ${CAT_NAMES[p.cat]}</div>
        <div style="position:absolute;top:10px;right:10px;background:${mc.bg};border:1px solid ${mc.color}33;border-radius:6px;padding:3px 8px;font-size:.65rem;font-weight:700;color:${mc.color};letter-spacing:.02em">${p.model}</div>
      </div>
      <div class="pcard-body">
        <div class="pcard-name">${p.name}</div>
        <div class="pcard-meta" style="display:flex;align-items:center;gap:6px">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${mc.color}"></span>
          <span style="color:${mc.color};font-weight:600">${p.model}</span>
          <span style="color:var(--muted)">${mc.years}</span>
        </div>
        <button class="pcard-add" onclick="toggleCart('${key.replace(/'/g,"\'")}','${p.cat}','${p.model}','${p.name.replace(/'/g,"\'")}')">
          ${isAdded ? '✓ Добавлено' : '+ В заявку'}
        </button>
      </div>
    </div>`;
  }).join('');
}

function toggleCart(key, cat, model, name) {
  if (cart[key]) {
    delete cart[key];
  } else {
    cart[key] = {key, name, model, cat, qty: 1};
  }
  updateCartUI();
  const card = document.getElementById('card-' + CSS.escape(key));
  if (card) {
    const isAdded = !!cart[key];
    card.classList.toggle('added', isAdded);
    card.style.borderColor = isAdded ? 'var(--green)' : '';
    const btn = card.querySelector('.pcard-add');
    if (btn) btn.textContent = isAdded ? '✓ Добавлено' : '+ В заявку';
  }
}

function updateCartUI() {
  const count = Object.keys(cart).length;
  const float = document.getElementById('cart-float');
  const num = document.getElementById('cart-count-num');
  float.style.display = count > 0 ? 'block' : 'none';
  num.textContent = count;
}

function goOrder() {
  // Cart + model ma'lumotlari
  const cartData = {};
  Object.entries(cart).forEach(([key, item]) => {
    cartData[key] = item;
  });
  localStorage.setItem('tashcom_cart', JSON.stringify(cartData));
  window.location.href = '/order.html';
}

function filterParts() {
  searchQ = document.getElementById('search').value;
  renderGrid();
}

// Init
renderTabs();
renderModelTabs();
renderGrid();
</script>
